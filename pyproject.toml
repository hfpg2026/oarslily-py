[project]
name = "oarslily"
version = "0.1.3a13"
description = "Add your description here"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "osslili @ git+https://github.com/hfpg2026/osslili@ebad5ae19f2b6c453acde1940745c6ab9224b6aa",
    "pyjson5>=2.0.0",
    "python-levenshtein>=0.27.3",
    "python-tlsh>=4.5.0",
    "typer>=0.21.1",
]

[project.scripts]
oarslily = "oarslily.cli:app"

[tool.setuptools]
packages = ["oarslily", "oarslily.core"]

[tool.uv]
package = true
